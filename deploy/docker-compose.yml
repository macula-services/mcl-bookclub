# mcl-bookclub — how to run this service.
#
# Runnable as-is. It carries what the SERVICE knows about itself: its image, its
# port, the environment variables its own code reads, and its health check.
#
#   MCL_REALM=<64-hex> \
#     MCL_REALM_KEY=<hex of the realm's public signing key> \
#     MACULA_STATION_SEEDS=station.example:4433 \
#     MACULA_STATION_NODE_IDS=<64-hex node id of that station> \
#     docker compose -p mcl-bookclub -f deploy/docker-compose.yml up -d
#
# IF YOU DEPLOY THROUGH SOMETHING ELSE, keep this file anyway and let the other
# thing carry PLACEMENT: which host, which station, which realm, which secret
# store.

services:
  mcl-bookclub:
    image: ghcr.io/macula-services/mcl-bookclub:latest
    container_name: mcl-bookclub
    restart: unless-stopped
    # HOST NETWORKING IS NOT LAZINESS. macula stations are reachable over IPv6
    # only, and a default docker bridge has no IPv6, so a bridged container
    # connects and then sits there with no healthy links, looking fine.
    network_mode: host
    volumes:
      # ⚠ THE SERVICE'S IDENTITY LIVES HERE. mcl_om generates the node key on
      # first boot and loads it on every boot after. Without the mount, every
      # recreate mints a new node id while the service looks healthy.
      - secrets:/etc/mcl/secrets
      # ⚠ REQUIRED, BECAUSE THIS SERVICE OPENS A STORE. Without the mount the
      # record lives inside the container and every recreate destroys it, which
      # is the same as not keeping one. On a bulk drive, not the root
      # filesystem, on any fleet node.
      - ${MCL_DATA:-/bulk0/mcl-bookclub}:/data
    labels:
      # Only meaningful if you run watchtower: it pulls a new :latest and
      # recreates the container. Harmless otherwise.
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # No default. A service that guesses its realm announces itself where
      # nobody can attribute it, and that looks exactly like a healthy node.
      - MCL_REALM=${MCL_REALM:?set MCL_REALM to the 64-hex realm tag}
      # The TRUST ANCHOR, and a different thing from MCL_REALM above: that is
      # an identifier, this is the realm's public signing key, hex encoded.
      - MCL_REALM_KEY=${MCL_REALM_KEY:?set MCL_REALM_KEY to the hex-encoded public realm signing key}
      # No default either: the dial is PINNED -- every seed host pairs with its
      # station's node id, index for index (D5).
      - MACULA_STATION_SEEDS=${MACULA_STATION_SEEDS:?set MACULA_STATION_SEEDS to "host[:port][,host[:port]...]"}
      - MACULA_STATION_NODE_IDS=${MACULA_STATION_NODE_IDS:?set MACULA_STATION_NODE_IDS to the matching 64-hex node ids, comma-separated}
      - MCL_NODE_NAME=mcl_bookclub
      - MCL_NODE_HOST=127.0.0.1
      - MCL_COOKIE=mcl_bookclub
      # Host networking means a port already bound on this host fails SILENTLY.
      - MCL_HEALTH_PORT=8484
      # Labels on the claim this service sends the realm at boot.
      - MCL_SERVICE_NAME=mcl-bookclub
      - MCL_BOX=${MCL_BOX:-}
      # Where the store lands, matching the volume above. The store itself is
      # at /data/mcl_bookclub_store and the sqlite read model at
      # /data/bookclub.sqlite3.
      - MCL_DATA_DIR=/data

# The identity volume, NAMED HERE rather than left to the project name, so a
# `docker compose -p' with a different name reuses the same key instead of
# quietly starting a second identity. Deleting it retires the node id.
volumes:
  secrets:
    name: mcl-bookclub-secrets
