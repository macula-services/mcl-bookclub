# Lint, EUnit and Dialyzer, in the CI image that pins the toolchain.
#
# The suite includes the desk suites, which run the command and projection
# paths against a real reckon-db store.

name: lint-and-test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'guides/**', 'scripts/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      # ⚠ THE SAME DIGEST-PINNED BUILD IMAGE AS THE Containerfile (macula-ci-otp:
      # OTP 28.4.3 on an OpenSSL with ML-DSA, rebar3, Rust, cmake). Its tag names
      # a date, not a release, so the step below refuses anything but 28.4.3.
      # mcl_bookclub_service_tests guards this pin, the builder's and the
      # runtime's.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      # No extra packages: nothing here builds rocksdb. The store is
      # reckon-db on khepri/ra; the read model is esqlite (vendored sqlite3.c).
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
